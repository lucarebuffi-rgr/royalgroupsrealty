  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b2a; --gold: #c8932a; --gold-light: #e8b84b;
      --gold-accessible: #8a5c14;
      --cream: #faf8f3; --white: #ffffff; --gray: #6b7280;
      --light-gray: #f3f4f6; --red: #c0392b; --green: #16a34a;
    }
    body { font-family: 'DM Sans', sans-serif; color: var(--navy); background: var(--cream); line-height: 1.6; }
    .topbar { background: var(--navy); color: var(--white); text-align: center; padding: 8px 16px; font-size: 0.85rem; letter-spacing: 0.03em; }
    .topbar a { color: var(--gold-light); text-decoration: none; font-weight: 600; }
    header { background: var(--white); box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .nav-slim { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; }
    .nav-slim img { height: 72px; width: auto; }
    .nav-phone { background: var(--gold-accessible); color: var(--white); padding: 10px 20px; border-radius: 6px; font-weight: 700; text-decoration: none; font-size: 0.95rem; }
    .nav-phone:hover { background: var(--gold); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 72px; }
    .list-head { max-width: 1100px; margin: 0 auto; padding: 36px 24px 8px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .list-head h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; }
    .list-head .h-icon { margin-right: 8px; }
    .sort-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--gray); }
    .state-pick { display: flex; gap: 48px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
    .state-card { text-align: center; cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; padding: 6px; }
    .state-card svg { height: 130px; width: auto; display: block; margin: 0 auto; transition: filter .25s ease, transform .25s ease; filter: drop-shadow(0 0 10px rgba(200,147,42,.25)); }
    .state-card path.state-shape { fill: #c9a86a; stroke: #8a6f3e; stroke-width: 2; transition: fill .25s ease; }
    .state-card:hover svg, .state-card.active svg { filter: drop-shadow(0 0 22px rgba(200,147,42,.65)); transform: scale(1.05); }
    .state-card.active path.state-shape { fill: #e8b84b; }
    .state-card .sname { margin-top: 10px; font-size: 1.05rem; letter-spacing: .3em; text-indent: .3em; color: var(--gold-accessible); font-weight: 700; }
    .state-card .cta { margin-top: 6px; font-size: 0.8rem; color: var(--gray); letter-spacing: .06em; }
    .show-all { display: block; margin: 14px auto 0; background: none; border: none; color: var(--gold-accessible); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: underline; }
    .sort-wrap select { border: 1.5px solid #d1d5db; border-radius: 20px; padding: 8px 14px; font-size: 0.85rem; font-family: 'DM Sans', sans-serif; background: var(--white); outline: none; cursor: pointer; }
    .deal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; margin-top: 20px; }
    .deal-card { background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); display: block; text-decoration: none; color: inherit; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .deal-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.1); }
    .deal-photo-wrap { position: relative; }
    .deal-photo { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--light-gray); display: block; }
    .deal-photo.placeholder { display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.85); font-size: 2.4rem; background: linear-gradient(135deg, #1a3050, #0d1b2a); }
    .status-badge { position: absolute; top: 12px; right: 12px; background: #dcfce7; color: #166534; font-size: 0.72rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; letter-spacing: 0.04em; }
    .deal-body { padding: 18px 20px 20px; }
    .deal-addr { font-weight: 700; font-size: 1.02rem; margin-bottom: 2px; }
    .deal-sub { color: var(--gray); font-size: 0.86rem; margin-bottom: 14px; min-height: 1.3em; }
    .deal-stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--light-gray); padding-top: 14px; text-align: center; }
    .deal-stats .lbl { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gray); margin-bottom: 2px; }
    .deal-stats .val { font-weight: 700; font-size: 0.98rem; }
    .deal-stats .val.ask { color: var(--green); }
    .empty-state { text-align: center; padding: 80px 24px; color: var(--gray); grid-column: 1 / -1; }
    .agent-strip { background: var(--white); border-radius: 12px; padding: 24px 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); display: flex; gap: 18px; align-items: center; margin-top: 40px; }
    .agent-strip img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); }
    .agent-strip .nm { font-weight: 700; }
    .agent-strip .co { color: var(--gray); font-size: 0.88rem; }
    .agent-strip .ph a { color: var(--gold-accessible); font-weight: 700; text-decoration: none; }
    footer { background: var(--navy); color: rgba(255,255,255,0.6); padding: 48px 24px 30px; }
    .footer-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 48px; margin-bottom: 32px; }
    .footer-brand p { font-size: 0.88rem; line-height: 1.7; }
    footer h3 { color: var(--white); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
    footer ul { list-style: none; display: grid; gap: 10px; }
    footer ul a { color: rgba(255,255,255,0.55); text-decoration: none; font-size: 0.9rem; }
    footer .phone { color: var(--gold-light); font-size: 1.15rem; font-weight: 600; }
    .footer-bottom { max-width: 1100px; margin: 0 auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px; text-align: center; font-size: 0.83rem; }
    @media (max-width: 900px) {
      .footer-inner { grid-template-columns: 1fr 1fr; }
      .nav-slim img { height: 56px; }
    }

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDNpa-2O0RduvXa5qmmIfFoioKG4gyoCOs",
      authDomain: "rgr-crm-941ab.firebaseapp.com",
      projectId: "rgr-crm-941ab"
    });
    const db = firebase.firestore();
    const DRIVE_KEY = "AIzaSyBV20moxsKtzMqfg66XdaQ8Q4tGGNAK6I0";
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const money = n => (n === '' || n == null || isNaN(+n)) ? '—' : '$' + (+n).toLocaleString();
    const $ = id => document.getElementById(id);
    function dealSlug(d) { return String(d.slug || '').trim() || String(d.address || '').replace(/[^a-zA-Z0-9]/g, '') || d.id; }

    function driveFolderId(url) {
      const m = String(url || '').match(/folders\/([a-zA-Z0-9_-]+)/);
      return m ? m[1] : '';
    }
    async function firstPhoto(deal) {
      if (deal.masterPhoto) return deal.masterPhoto;
      const fid = driveFolderId(deal.driveFolderUrl);
      if (!fid) return '';
      try {
        const q = encodeURIComponent("'" + fid + "' in parents and mimeType contains 'image/' and trashed = false");
        const r = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&key=' + DRIVE_KEY + '&fields=files(thumbnailLink)&pageSize=1');
        const j = await r.json();
        const f = (j.files || [])[0];
        return f ? (f.thumbnailLink || '').replace(/=s\d+.*$/, '=s800') : '';
      } catch (e) { return ''; }
    }

    async function boot() {
      const grid = $('deal-grid');
      try {
        const r = await fetch('/api/deals');
        if (!r.ok) throw new Error('deals API ' + r.status);
        let deals = (await r.json()).map(d => ({ id: d._id, ...d }));
        deals.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
        if (!deals.length) {
          grid.innerHTML = '<div class="empty-state"><h2>No active deals right now</h2><p>Check back soon — new off-market opportunities land here first.</p></div>';
          return;
        }
        window._allDeals = deals;
        window._stateFilter = 'ALL';
        const showAllBtn = $('show-all');
        document.querySelectorAll('#state-tabs .state-card').forEach(btn => {
          btn.onclick = () => {
            const st = btn.dataset.st;
            if (window._stateFilter === st) {
              window._stateFilter = 'ALL';
              btn.classList.remove('active');
              showAllBtn.style.display = 'none';
            } else {
              document.querySelectorAll('#state-tabs .state-card').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              window._stateFilter = st;
              showAllBtn.style.display = 'block';
            }
            renderDeals();
          };
        });
        showAllBtn.onclick = () => {
          window._stateFilter = 'ALL';
          document.querySelectorAll('#state-tabs .state-card').forEach(b => b.classList.remove('active'));
          showAllBtn.style.display = 'none';
          renderDeals();
        };
        renderDeals();
        $('sort-sel').onchange = renderDeals;
        function renderDeals() {
          const mode = ($('sort-sel') || {}).value || 'date';
          const sf = window._stateFilter || 'ALL';
          const list = (window._allDeals || []).filter(d => sf === 'ALL' || String(d.state || '').toUpperCase() === sf).slice();
          if (mode === 'price-asc') list.sort((a, b) => (+a.askPrice || 0) - (+b.askPrice || 0));
          else if (mode === 'price-desc') list.sort((a, b) => (+b.askPrice || 0) - (+a.askPrice || 0));
          else list.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
          if (!list.length) {
            const lbl = sf === 'ALL' ? '' : (sf === 'TX' ? ' in Texas' : ' in Georgia');
            grid.innerHTML = '<div class="empty-state"><h2>No active deals' + lbl + ' right now</h2><p>Check back soon &mdash; new off-market opportunities land here first.</p></div>';
            return;
          }
          grid.innerHTML = list.map(d => {
            const addr = [d.address, d.city].filter(Boolean).join(', ') + (d.state ? ', ' + d.state : '') + (d.zip ? ' ' + d.zip : '');
            return '<a class="deal-card" href="/' + esc(dealSlug(d)) + '">' +
              '<div class="deal-photo-wrap"><div class="deal-photo placeholder" data-photofolder="' + esc(d.driveFolderUrl || '') + '" data-master="' + esc(d.masterPhoto || '') + '">&#127968;</div>' +
              '<span class="status-badge">Active</span></div>' +
              '<div class="deal-body">' +
              '<div class="deal-addr">' + esc(addr) + '</div>' +
              '<div class="deal-sub">' + esc(d.headline || '') + '</div>' +
              '<div class="deal-stats">' +
              '<div><div class="lbl">Asking</div><div class="val ask">' + money(d.askPrice) + '</div></div>' +
              '<div><div class="lbl">Beds</div><div class="val">' + esc(d.beds || '&mdash;') + '</div></div>' +
              '<div><div class="lbl">Baths</div><div class="val">' + esc(d.baths || '&mdash;') + '</div></div>' +
              '<div><div class="lbl">Sqft</div><div class="val">' + (d.sqft ? (+d.sqft).toLocaleString() : '&mdash;') + '</div></div>' +
              '</div></div></a>';
          }).join('');
          grid.querySelectorAll('[data-photofolder]').forEach(async el => {
            const url = await firstPhoto({ masterPhoto: el.getAttribute('data-master'), driveFolderUrl: el.getAttribute('data-photofolder') });
            if (url) {
              const img = document.createElement('img');
              img.className = 'deal-photo'; img.loading = 'lazy'; img.src = url; img.alt = 'Property photo';
              el.replaceWith(img);
            }
          });
        }
      } catch (e) {
        console.error(e);
        grid.innerHTML = '<div class="empty-state"><h2>Could not load deals</h2><p>Please try again or call 469-665-8481.</p></div>';
      }
    }
    boot();
  </script>
</body>
</html>
